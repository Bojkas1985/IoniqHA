apply plugin: 'com.android.application'

android {
    // Novější AGP (7.4.2) potřebuje novější compileSdk, aby neřešil
    // chybějící/staré SDK platformy - na minSdk/cílovou appku na head-unitu
    // (API 17) to nemá vliv, je to jen "s čím se appka kompiluje".
    compileSdkVersion 33

    defaultConfig {
        applicationId "cz.ivica.ioniqha"
        minSdkVersion 17
        targetSdkVersion 17
        versionCode 1
        versionName "1.0"
        ndk {
            // Head-unit je starý armeabi-v7a, stejně jako u ABRPTransmitteru.
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Stub pro LGE IVI framework (GreenCarManager/CarInfoManager/HvacManager) - jen
    // pro kompilaci, v runtime to poskytuje přímo head-unit. Viz app/externallibs/readme.txt.
    compileOnly files('externallibs/com.lge.ivi.jar')

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation('com.github.bright:slf4android:0.1.6') { transitive = true }
}
